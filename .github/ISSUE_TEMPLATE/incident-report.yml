name: Incident Report
description: Report a real-world security incident as a convergence challenge
title: "[INCIDENT] "
labels: ["incite: incident", "stream: incited"]
body:
  - type: markdown
    attributes:
      value: |
        ## Report an Incident

        A real-world security incident can catalyze a convergence challenge just like a published paper.
        Incident-type challenges carry disclosure notices and may have different metrics than paper challenges
        (forensic detection layers instead of archetype gate rates, for example).

        If the constraint stack catches patterns in the incident — or if it reveals a real gap — that's valuable either way.

  - type: input
    id: incident-title
    attributes:
      label: Incident Title
      description: Short descriptive title for the incident
      placeholder: "e.g., UAT-8616 Cisco SD-WAN Infrastructure Compromise"
    validations:
      required: true

  - type: textarea
    id: cves
    attributes:
      label: CVEs / Advisory IDs
      description: |
        List relevant CVEs, CISA directives, vendor advisories, or other formal identifiers.
      placeholder: |
        CVE-2026-20127 (CVSS 10.0)
        CISA ED 26-03
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Incident Description
      description: |
        What happened? What systems are affected? What is the blast radius?
        Be specific about the failure modes, not just the vulnerability.
      placeholder: |
        Nation-state actors exploited authentication bypass in Cisco SD-WAN controllers
        to gain persistent root access, with firmware downgrade-and-restore to erase evidence.
    validations:
      required: true

  - type: textarea
    id: failure-modes
    attributes:
      label: Failure Modes
      description: |
        What specific failure modes does this incident demonstrate?
        These become the detection targets for a challenge harness.
      placeholder: |
        1. Authentication bypass — unauthenticated remote access
        2. Evidence erasure — firmware rollback hides compromise
        3. Forensic tool detection — adversary monitors for investigation activity
    validations:
      required: true

  - type: dropdown
    id: incite-type
    attributes:
      label: Incite Type
      description: What catalyzed this challenge?
      options:
        - Incident (active exploitation / CVE)
        - Pattern (recurring failure across incidents)
        - Community (contributor-identified gap)
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Challenge Theme
      description: Which narrative theme does this challenge fit?
      options:
        - Scale Invariance (same pattern at different scales)
        - Infrastructure Sovereignty (attacker controls the fabric)
        - The Tootsie Pop (multi-layer / nested attacks)
        - Bounty Board (known failure, no constraint response)
        - Provider Blind Spot (provider-specific gap)
        - Trojan Horse (benign wrapper, adversarial core)
        - Other / New Theme

  - type: textarea
    id: edges
    attributes:
      label: Connections to Existing Challenges (Optional)
      description: |
        Does this incident connect to existing challenges in the loom?
        Describe upstream (what fed into this) or downstream (what this feeds) edges.
      placeholder: |
        Social engineering patterns from Agents of Chaos map to the adversary's
        Paranoid Benefactor tactic (legitimate-looking authorization for infrastructure access).

  - type: checkboxes
    id: contribution-level
    attributes:
      label: What are you offering?
      options:
        - label: "Incident identification only — someone else builds the response"
        - label: "I can help map failure modes to detection layers"
        - label: "I can build detection tooling or a constraint harness"
        - label: "I have IOCs, forensic artifacts, or adversary TTPs to share"

  - type: input
    id: contact
    attributes:
      label: Contact (Optional)
      description: How should we credit you? GitHub handle is fine.
      placeholder: "@yourhandle or email"
